<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>Home</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap"
    rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
</head>

<body class="bg-[#0d0d0f] min-h-screen">
  <header
    class="sticky top-0 z-[100] bg-[rgba(13,13,15,0.92)] backdrop-blur-[14px] border-b-[0.5px] border border-b-[#5A5A5A]">
    <div class="max-w[900px] mx-auto h-[56px] px-5 py-5 flex items-center gap-[16px]">
      <div class="font-['Syne'] font-bold text-xl text-[#FF6B2B] tracking-[-0.5px] whitespace-nowrap shrink-0">
        Devbook
      </div>

      <div class="relative max-w-[400px] w-full">
        <svg class="absolute left-[11px] top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 w-[15px] h-[15px]"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
        </svg>

        <input type="text" placeholder="Buscar publicações"
          class="w-full h-[35px] pr-[14px] pl-[34px] rounded-full bg-[rgba(255,255,255,0.07)] border-[0.5px] border-[rgba(255,255,255,0.07)] outline-none text-sm text-white placeholder-gray-500 transition-[border-color,background] duration-150" />
      </div>

      <div class="flex items-center gap-[10px] ml-auto shrink-0">
        <button
          class="flex items-center gap-[6px] text-[#5c5a6b] font-['DM Sans'] font-medium border-[0.5px] border-[#5a5a5a] py-1.5 px-[11px] rounded-[10px] cursor-pointer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="w-[13px] h-[13px]">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span class="logout">Sair</span>
        </button>
      </div>

    </div>
  </header>

  <main class="max-w-[900px] m-auto pt-3 px-5 pb-12 flex flex-col gap-[10px]">
    <div class="flex items-center mt-[px] justify-between">
      <div class="font-['Syne'] text-[15px] font-semibold text-[#9896a8]">
        Feed
      </div>
      <button
        class="bg-[#ff6b2b] text-white  text-[13px] cursor-pointer font-medium rounded-[10px] py-[7px] px-[15px] transition-opacity duration-150">+
        Nova publicaco</button>
    </div>

    <article
      class="font-['DM Sans'] bg-[#FF6B2B18] border border-[#FF6B2B30] rounded-[14px] pt-[1.1rem] px-5 pb-[0.9rem] text-[#f0eff5] transition-[border-color] duration-150 transition-[transform] duration-[120ms] ">
      <div class="text-[#ededed]">
        {{range .}}
        <div class="text-[13px] text-[#9896a8] font-medium">Usuario de drogas</div>
        <div class="text-[15px] font-medium text-[#f0eff5] mb-[6px] leading-[1.45]">{{.Title}}</div>
        <div class="text-[13.5px] text-[#f0eff5] leading-[1.65] mb-[12px]">{{.Content}}</div>
        {{end}}
      </div>

      <div class="flex items-center gap-[4px] border-t-1 border-[#2A2A2A] pt-[10px]">
        <button class=" like flex items-center gap-[5px] py-[5px] px-[9px] rounded-[6px] text-[12px]">
          <svg viewBox="0 0 24 24" fill="var(--red)" stroke="var(--red)" stroke-width="2"
            class="w-[14px] h-[13px] shrink-0">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
              id="like-icon">
            </path>
          </svg>
          <span id="count">0</span>
        </button>
        <button class="action-btn flex items-center gap-[5px] py-[5px] px-[9px] rounded-[6px] text-[12px]">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="w-[14px] h-[13px] shrink-0">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          47
        </button>
      </div>
    </article>
  </main>
  <script src="/assets/js/home.js"></script>
</body>

</html>
