<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Home</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Gudea:ital,wght@0,400;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="w-auto h-auto">
        <header
            class="flex justify-between items-center bg-zinc-900 text-white p-3"
        >
            <div>
                <h1 class="text-center text-2xl font-black font-[Gudea]">
                    Pagina Principal
                </h1>
            </div>
            <div>
                <button class="border-b-2 border-white-900 cursor-pointer mr-3">
                    <a href="/">Sair</a>
                </button>
            </div>
        </header>
        <main class="bg-red-500">
            {{ range . }}
            <h3>{{.title}}</h3>
            {{ end }}
        </main>
    </body>
</html>
