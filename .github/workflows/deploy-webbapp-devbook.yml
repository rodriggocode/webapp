name: Frontend Webapp Devbook

on:
  push:
    branches:
      - developer

jobs:
  build_webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Mostrar versão do Go
        run: go version
