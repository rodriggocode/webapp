<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#161616"/>

  <!-- Border subtle -->
  <rect width="100" height="100" rx="18" fill="none" stroke="#5A5A5A" stroke-width="1.5"/>

  <!-- Book shape -->
  <rect x="22" y="25" width="26" height="50" rx="3" fill="#0C0C0C" stroke="#5A5A5A" stroke-width="1"/>
  <rect x="52" y="25" width="26" height="50" rx="3" fill="#0C0C0C" stroke="#5A5A5A" stroke-width="1"/>

  <!-- Spine -->
  <rect x="47" y="25" width="6" height="50" fill="#FF5C1A"/>

  <!-- Lines on left page -->
  <line x1="27" y1="38" x2="43" y2="38" stroke="#5A5A5A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="45" x2="43" y2="45" stroke="#5A5A5A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="52" x2="43" y2="52" stroke="#5A5A5A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="59" x2="38" y2="59" stroke="#FF5C1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Lines on right page -->
  <line x1="57" y1="38" x2="73" y2="38" stroke="#5A5A5A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="45" x2="73" y2="45" stroke="#5A5A5A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="52" x2="73" y2="52" stroke="#5A5A5A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="59" x2="68" y2="59" stroke="#FF5C1A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
