app = 'webapp-delicate-butterfly-8620'
primary_region = 'gru'

[build]
    builder = "paketobuildpacks/builder:full-cnb"

[env]
  PORT = '7070'

[http_service]
  internal_port = 7070
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
