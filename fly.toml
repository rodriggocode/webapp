# fly.toml app configuration file generated by flyctl
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "seu-app-devbook" # Substitua por um nome único para sua aplicação no Fly.io
primary_region = "gru" # Escolha a região mais próxima de você ou dos seus usuários (ex: gru para São Paulo)

[build]
  builder = "paketobuildpacks/builder-jammy-base" # Builder padrão do Fly.io, pode ser omitido se usar Dockerfile

[env]
  # Defina aqui as variáveis de ambiente que sua aplicação precisa
  # O Fly.io injeta a porta na variável PORT por padrão.
  # Se sua aplicação espera "APP_PORT", você tem duas opções:
  # 1. Mudar o código Go para ler "PORT" (recomendado)
  # 2. Adicionar a variável APP_PORT aqui, mapeando para PORT. Ex: APP_PORT = "$PORT"

  # Exemplo de variáveis de ambiente:
  # API_URL = "https://sua-api.com"
  # HAS_KEY = "sua_chave_de_hash"
  # BLOCK_KEY = "sua_chave_de_bloco"
  # DATABASE_URL = "postgres://user:pass@host:port/dbname" # Se usar banco de dados externo

[http_service]
  internal_port = 8080 # A porta que sua aplicação Go está escutando internamente no contêiner
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Se você precisar de um banco de dados PostgreSQL gerenciado pelo Fly.io:
# Você pode provisionar um com 'fly postgres create' e depois anexar com 'fly postgres attach'
# O Fly.io então injetará a DATABASE_URL na sua aplicação.
# Ou, se usar um banco externo, configure a DATABASE_URL na seção [env] acima.
